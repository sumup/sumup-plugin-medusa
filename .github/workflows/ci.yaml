name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn biome ci --diagnostic-level=error --reporter=github

      - name: Test provider behavior
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Build plugin bundle
        run: |
          yarn build
          test -f .medusa/server/src/providers/sumup/index.js

      - name: Check package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Install example dependencies
        run: yarn --cwd examples/docker/medusa install --frozen-lockfile

      - name: Load built plugin into example
        run: |
          mkdir -p examples/docker/medusa/node_modules/@sumup/medusa-plugin
          cp package.json examples/docker/medusa/node_modules/@sumup/medusa-plugin/
          cp -R .medusa examples/docker/medusa/node_modules/@sumup/medusa-plugin/

      - name: Build example backend and admin
        run: yarn --cwd examples/docker/medusa build
