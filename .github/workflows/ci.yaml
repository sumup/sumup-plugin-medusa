name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Validate (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [24, 26]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install pinned Yarn
        run: npm install --global yarn@1.22.22

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint code
        run: yarn biome ci --diagnostic-level=error --reporter=github

      - name: Test provider behavior
        run: yarn test

      - name: Typecheck
        run: yarn typecheck

      - name: Build plugin bundle
        run: |
          yarn build
          test -f .medusa/server/src/providers/sumup/index.js

      - name: Pack plugin and check package contents
        run: |
          npm pack --ignore-scripts --json --pack-destination "$RUNNER_TEMP" > "$RUNNER_TEMP/sumup-package.json"
          node -e 'const assert = require("node:assert/strict"); const [artifact] = require(process.env.RUNNER_TEMP + "/sumup-package.json"); assert(!artifact.files.some(({ path }) => path.includes("__tests__")), "Published package must exclude test files")'

      - name: Install example dependencies
        run: yarn --cwd examples/docker/medusa install --frozen-lockfile

      - name: Install packed plugin into example
        run: |
          plugin_tarball=$(node -p 'require(process.env.RUNNER_TEMP + "/sumup-package.json")[0].filename')
          mkdir -p examples/docker/medusa/node_modules/@sumup/medusa-plugin
          tar -xzf "$RUNNER_TEMP/$plugin_tarball" --strip-components=1 -C examples/docker/medusa/node_modules/@sumup/medusa-plugin

      - name: Verify installed package exports
        working-directory: examples/docker/medusa
        run: node -e 'require("@sumup/medusa-plugin"); require("@sumup/medusa-plugin/providers/sumup")'

      - name: Build example backend and admin
        run: yarn --cwd examples/docker/medusa build
